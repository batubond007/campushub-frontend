name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; let a running one finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  ARTIFACT_KEY: campushub-frontend/${{ github.sha }}.tar.gz

jobs:
  deploy:
    runs-on: ubuntu-latest
    # AWS keys live in this environment's secrets; the environment only allows the main branch.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # VITE_API_BASE_URL is left empty: nginx serves the site and proxies /api on the same origin.
      - name: Type-check and build
        run: npm run build

      - name: Package dist
        run: tar -czf site.tar.gz -C dist .

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload build to S3
        run: aws s3 cp site.tar.gz "s3://$S3_BUCKET/$ARTIFACT_KEY"

      - name: Deploy on EC2 via SSM Run Command
        run: |
          # Script executed on the instance as root.
          # Each deploy goes to its own release dir; the "current" symlink is switched atomically.
          cat > remote.sh <<EOF
          set -eu
          BASE=/var/www/campushub
          REL=\$BASE/releases/$GITHUB_SHA
          TMP=/tmp/campushub-frontend-$GITHUB_SHA.tar.gz
          mkdir -p "\$REL"
          aws s3 cp "s3://$S3_BUCKET/$ARTIFACT_KEY" "\$TMP"
          tar -xzf "\$TMP" --no-same-owner -C "\$REL"
          rm -f "\$TMP"
          ln -sfn "\$REL" "\$BASE/current.tmp"
          mv -Tf "\$BASE/current.tmp" "\$BASE/current"
          # Keep the 5 newest releases.
          cd "\$BASE/releases" && ls -1t | tail -n +6 | xargs -r rm -rf
          if curl -fsS -o /dev/null http://localhost/; then echo "Healthy"; else echo "nginx check failed"; exit 1; fi
          EOF

          jq -n --rawfile script remote.sh '{commands: [$script]}' > params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Frontend deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 300 \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID"

          # Poll until the command finishes (up to ~5 min).
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" --query StandardOutputContent --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" --query StandardErrorContent --output text

          echo "Final status: $STATUS"
          [ "$STATUS" = "Success" ]
